<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0d1013" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Turn Timer" />
<title>Turn Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0d1013; --card:#171b20; --line:#272d34; --ink:#eef2f5; --soft:#93a0ab;
    --accent:#3fb98a; --accent-ink:#04140d; --warn:#e5533c; --focus:#54c8ff;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f5f4; --card:#fff; --line:#e2e6e4; --ink:#14181c; --soft:#5c6772; --accent-ink:#fff; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;min-height:100dvh;
    padding:max(14px,env(safe-area-inset-top)) 16px calc(18px+env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;touch-action:manipulation}
  header{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:6px}
  header .dot{width:18px;height:18px;border-radius:6px;background:radial-gradient(circle at 30% 25%,#8ff0c6,var(--accent))}
  header h1{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .who{font-size:15px;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;font-weight:650}
  .player{font-size:clamp(30px,9vw,52px);font-weight:750;letter-spacing:-.02em;line-height:1;text-align:center;text-wrap:balance}
  .clock{font:750 clamp(84px,34vw,190px)/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:4px 0}
  .clock.low{color:var(--warn)}
  .up .clock{color:var(--warn);animation:zoom .4s ease 0s 8}
  .up .player{color:var(--warn)}
  .flash{animation:flash .4s ease 0s 8}
  @keyframes flash{0%,100%{background:transparent}50%{background:color-mix(in srgb,var(--warn) 50%,var(--bg))}}
  @keyframes zoom{50%{transform:scale(1.06)}}
  .hint{font-size:13px;color:var(--soft);min-height:18px}

  .controls{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:8px}
  button{font-family:var(--sans);cursor:pointer;border:0}
  .primary{background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:20px;
    padding:0 30px;height:64px;border-radius:16px;min-width:150px}
  .primary.running{background:var(--warn);color:#fff}
  .round{width:64px;height:64px;border-radius:16px;background:var(--card);border:1px solid var(--line);
    color:var(--ink);font-size:15px;font-weight:650;display:grid;place-items:center}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  .setup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;
    display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;width:100%;align-self:center}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--soft);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
  .stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
  .stepper button{width:46px;font-size:22px;background:transparent;color:var(--ink)}
  .stepper input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);text-align:center;
    font:700 20px var(--mono);font-variant-numeric:tabular-nums}
  .stepper input:focus{outline:none}
  .sel{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 10px;font:600 15px var(--sans);width:100%}
  .sel:focus{outline:none;border-color:var(--accent)}
  .presets{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;
    padding:8px 14px;font-size:14px;font-weight:650}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .row2{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
  .toggle input{width:20px;height:20px;accent-color:var(--accent)}
  .muted{color:var(--soft);font-size:12.5px}
  .names{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
  .label-row{display:flex;align-items:center;justify-content:space-between}
  .label-row label{font-size:12px;color:var(--soft);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
  .tiny{background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:650}
  .names-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .name-inp{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px}
  .name-inp .n{font:700 12px var(--mono);color:var(--soft);min-width:16px;text-align:right}
  .name-inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:600 15px var(--sans);padding:10px 4px}
  .name-inp input:focus{outline:none}
  @media (max-width:430px){ .names-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
  <header><span class="dot"></span><h1>Turn Timer</h1></header>

  <div class="stage" id="stage">
    <div class="who" id="who">Player 1</div>
    <div class="player" id="player">Ready</div>
    <div class="clock" id="clock">0:30</div>
    <div class="hint" id="hint">Set the seconds, then Start.</div>
    <div class="controls">
      <button class="round" id="reset" title="Reset">Reset</button>
      <button class="primary" id="startpause">Start</button>
      <button class="round" id="next" title="Next player">Next ⟶</button>
    </div>
  </div>

  <div class="setup">
    <div class="field">
      <label>Seconds per turn</label>
      <div class="stepper">
        <button data-step="-5" data-target="secs">−</button>
        <input id="secs" type="number" inputmode="numeric" min="1" max="3600" value="30" />
        <button data-step="5" data-target="secs">+</button>
      </div>
    </div>
    <div class="field">
      <label>Players</label>
      <div class="stepper">
        <button data-step="-1" data-target="players">−</button>
        <input id="players" type="number" inputmode="numeric" min="1" max="30" value="6" />
        <button data-step="1" data-target="players">+</button>
      </div>
    </div>
    <div class="field">
      <label>Heads-up at (% left)</label>
      <div class="stepper">
        <button data-step="-10" data-target="warnpct">−</button>
        <input id="warnpct" type="number" inputmode="numeric" min="0" max="90" step="10" value="50" />
        <button data-step="10" data-target="warnpct">+</button>
      </div>
    </div>
    <div class="field">
      <label>Alarm sound</label>
      <select id="alarm-sound" class="sel"></select>
    </div>
    <div class="presets" id="presets">
      <button class="chip" data-secs="10">10s</button>
      <button class="chip" data-secs="15">15s</button>
      <button class="chip" data-secs="30">30s</button>
      <button class="chip" data-secs="45">45s</button>
      <button class="chip" data-secs="60">60s</button>
      <button class="chip" data-secs="90">90s</button>
    </div>
    <div class="row2">
      <label class="toggle"><input type="checkbox" id="autoloop" checked /> Auto-advance to next player</label>
      <button type="button" id="test" class="ghost-btn" style="padding:9px 16px">🔊 Test</button>
    </div>
    <p class="muted" style="grid-column:1/-1;margin:0">iPhone: tap <b>Test</b> once to unlock sound and keep your volume up. Heads-up at <b>0</b> = off. Picking a sound previews it.</p>
    <div class="names">
      <div class="label-row"><label>Player names (optional)</label><button type="button" class="tiny" id="names-clear">Clear</button></div>
      <div class="names-grid" id="names-grid"></div>
    </div>
  </div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const stage=$("stage"), whoEl=$("who"), playerEl=$("player"), clockEl=$("clock"), hintEl=$("hint");
  const startBtn=$("startpause"), resetBtn=$("reset"), nextBtn=$("next");
  const secsIn=$("secs"), playersIn=$("players"), autoloop=$("autoloop"), warnPctIn=$("warnpct"), testBtn=$("test"), alarmSel=$("alarm-sound");

  const LS="turntimer.cfg";
  let cfg = load();
  secsIn.value=cfg.secs; playersIn.value=cfg.players; autoloop.checked=cfg.autoloop; warnPctIn.value=cfg.warnpct;

  let duration=clampInt(secsIn.value,1,3600,30);
  let remaining=duration;
  let players=clampInt(playersIn.value,1,30,6);
  let cur=1;
  let names = Array.isArray(cfg.names) ? cfg.names.slice() : [];
  let warnPct=clampInt(cfg.warnpct,0,90,50);
  let warned=false;
  let running=false, deadline=0, raf=0, tick=0;

  function load(){ try{return Object.assign({secs:30,players:6,autoloop:true,warnpct:50,sound:"siren",names:[]}, JSON.parse(localStorage.getItem(LS))||{});}catch{ return {secs:30,players:6,autoloop:true,warnpct:50,sound:"siren",names:[]}; } }
  function save(){ localStorage.setItem(LS, JSON.stringify({secs:duration,players:players,autoloop:autoloop.checked,warnpct:warnPct,sound:alarmChoice,names:names})); }
  function clampInt(v,lo,hi,fb){ v=parseInt(v,10); if(isNaN(v))v=fb; return Math.min(hi,Math.max(lo,v)); }
  function fmt(s){ s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60); const r=s%60; return m>0? m+":"+String(r).padStart(2,"0") : String(r); }
  function nameOf(i){ const n=(names[i-1]||"").trim(); return n || ("Player "+i); }

  const namesGrid=$("names-grid");
  function buildNames(){
    namesGrid.innerHTML="";
    for(let i=1;i<=players;i++){
      const wrap=document.createElement("label"); wrap.className="name-inp";
      const num=document.createElement("span"); num.className="n"; num.textContent=i;
      const inp=document.createElement("input"); inp.type="text"; inp.maxLength=24;
      inp.placeholder="Player "+i; inp.value=names[i-1]||"";
      inp.addEventListener("input",()=>{ names[i-1]=inp.value; save(); if(!running) render(); });
      wrap.append(num,inp); namesGrid.append(wrap);
    }
  }
  $("names-clear").addEventListener("click",()=>{ names=[]; buildNames(); save(); if(!running) render(); });

  function render(){
    clockEl.textContent = fmt(remaining);
    const lowAt = Math.max(5, duration*0.2);
    clockEl.classList.toggle("low", remaining<=lowAt && remaining>0 && running);
    whoEl.textContent = "Turn "+cur+" of "+players;
    if(!running){ playerEl.textContent = remaining<=0 ? nameOf(cur)+" — Time!" : nameOf(cur); }
  }

  // --- Audio ---
  // iOS Safari mutes the Web Audio API when the ring/silent switch is on, so we
  // synthesize real WAV clips and play them through a single <audio> media
  // element (media plays even on silent), unlocked on the first user tap.
  const RATE=22050;
  function toWav(samples){
    const n=samples.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt ");
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,RATE,true); v.setUint32(28,RATE*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    w(36,"data"); v.setUint32(40,n*2,true);
    let o=44; for(let i=0;i<n;i++){ const c=Math.max(-1,Math.min(1,samples[i])); v.setInt16(o, c<0?c*0x8000:c*0x7fff, true); o+=2; }
    let bin=""; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) bin+=String.fromCharCode(b[i]);
    return "data:audio/wav;base64,"+btoa(bin);
  }
  function synth(notes, type, amp, noteLen, gap){
    const N=Math.ceil(RATE*(notes.length*noteLen+0.03)); const s=new Float32Array(N);
    for(let idx=0; idx<notes.length; idx++){
      const f=notes[idx], on=noteLen-gap, base=Math.floor(idx*noteLen*RATE);
      for(let k=0, K=Math.floor(on*RATE); k<K; k++){
        const t=k/RATE;
        const val = type==="square" ? (Math.sin(2*Math.PI*f*t)>=0?1:-1) : Math.sin(2*Math.PI*f*t);
        const env = Math.min(1, t/0.006) * Math.max(0, 1 - t/on);
        s[base+k] = val*amp*env;
      }
    }
    return toWav(s);
  }
  // Pick-and-choose end-of-turn sounds (order preserved for the dropdown).
  const SOUNDS = {
    siren:   { label:"Siren",    url: synth([988,1319,988,1319,988,1319,1568,1319,1568], "square", 0.75, 0.18, 0.03) },
    beeps:   { label:"Beeps",    url: synth([1046,1046,1046,1046], "square", 0.7, 0.22, 0.09) },
    buzzer:  { label:"Buzzer",   url: synth([196,185,196,185,196,185], "square", 0.85, 0.16, 0.0) },
    airhorn: { label:"Air horn", url: synth([415,392,415,392], "square", 0.9, 0.34, 0.0) },
    chime:   { label:"Chime",    url: synth([523,659,784,1047,1319], "sine", 0.7, 0.16, 0.02) },
    bells:   { label:"Bells",    url: synth([1319,988,1319,988,1319], "triangle", 0.65, 0.22, 0.06) },
    arcade:  { label:"Arcade",   url: synth([784,1047,784,1047,1568,1047,1568,2093], "square", 0.6, 0.12, 0.02) },
  };
  let alarmChoice = SOUNDS[cfg.sound] ? cfg.sound : "siren";
  const WARN_URL  = synth([784,988], "triangle", 0.6, 0.2, 0.05);
  const SILENT_URL= toWav(new Float32Array(Math.floor(RATE*0.04)));

  let sfx=null, audioReady=false;
  function initAudio(){ sfx=new Audio(); sfx.preload="auto"; sfx.setAttribute("playsinline",""); sfx.volume=1; }
  function unlockAudio(){
    if(audioReady||!sfx) return;
    try{ sfx.src=SILENT_URL; const p=sfx.play(); if(p&&p.then) p.then(()=>{audioReady=true;}).catch(()=>{}); else audioReady=true; }catch{}
  }
  function play(url){ if(!sfx) return; try{ sfx.pause(); sfx.src=url; sfx.currentTime=0; const p=sfx.play(); if(p&&p.catch) p.catch(()=>{}); }catch{} }
  const playAlarm=()=>play((SOUNDS[alarmChoice]||SOUNDS.siren).url);
  const playWarn =()=>play(WARN_URL);
  function vibrate(p){ if(navigator.vibrate) navigator.vibrate(p); }

  let wakeLock=null;
  async function keepAwake(on){
    try{
      if(on && "wakeLock" in navigator){ wakeLock=await navigator.wakeLock.request("screen"); }
      else if(wakeLock){ wakeLock.release(); wakeLock=null; }
    }catch{}
  }

  function loop(){
    remaining=(deadline-performance.now())/1000;
    if(remaining<=0){ remaining=0; render(); return finish(); }
    if(!warned && warnPct>0 && remaining<=duration*warnPct/100){ warned=true; playWarn(); vibrate([80,50,80]); hintEl.textContent=warnPct+"% left — "+fmt(remaining); }
    render();
    raf=requestAnimationFrame(loop);
  }

  function start(){
    duration=clampInt(secsIn.value,1,3600,30); players=clampInt(playersIn.value,1,30,6); warnPct=clampInt(warnPctIn.value,0,90,50);
    if(cur>players) cur=1;
    if(remaining<=0){ remaining=duration; warned=false; }
    unlockAudio(); save();
    running=true;
    stage.classList.remove("up","flash");
    playerEl.textContent=nameOf(cur);
    hintEl.textContent="Timer running…";
    startBtn.textContent="Pause"; startBtn.classList.add("running");
    deadline=performance.now()+remaining*1000;
    keepAwake(true);
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  }
  function pause(){
    running=false; cancelAnimationFrame(raf);
    startBtn.textContent="Start"; startBtn.classList.remove("running");
    hintEl.textContent="Paused."; keepAwake(false);
  }
  function finish(){
    running=false; cancelAnimationFrame(raf);
    startBtn.textContent="Start"; startBtn.classList.remove("running");
    stage.classList.add("up"); stage.classList.remove("flash"); void stage.offsetWidth; stage.classList.add("flash");
    playAlarm(); vibrate([300,120,300,120,300,120,600]);
    playerEl.textContent=nameOf(cur)+" — TIME!";
    hintEl.textContent = autoloop.checked ? "Next player up…" : "Tap Next for the next player.";
    keepAwake(false);
    if(autoloop.checked){
      setTimeout(()=>{ advance(); remaining=duration; render(); start(); }, 900);
    }
  }
  function advance(){
    cur = cur>=players ? 1 : cur+1;
    warned=false;
    stage.classList.remove("up","flash");
  }
  function nextPlayer(){
    advance(); remaining=duration; playerEl.textContent=nameOf(cur); hintEl.textContent="Set — press Start."; render();
    if(running){ deadline=performance.now()+remaining*1000; }
  }
  function reset(){
    pause(); cur=1; warned=false; duration=clampInt(secsIn.value,1,3600,30); remaining=duration;
    stage.classList.remove("up","flash"); hintEl.textContent="Set the seconds, then Start.";
    render();
  }

  // events
  startBtn.addEventListener("click", ()=> running?pause():start());
  resetBtn.addEventListener("click", reset);
  nextBtn.addEventListener("click", ()=>{ unlockAudio(); nextPlayer(); });
  secsIn.addEventListener("change", ()=>{ duration=clampInt(secsIn.value,1,3600,30); secsIn.value=duration; if(!running){remaining=duration;render();} save(); });
  playersIn.addEventListener("change", ()=>{ players=clampInt(playersIn.value,1,30,6); playersIn.value=players; if(cur>players)cur=1; buildNames(); render(); save(); });
  warnPctIn.addEventListener("change", ()=>{ warnPct=clampInt(warnPctIn.value,0,90,50); warnPctIn.value=warnPct; save(); });
  autoloop.addEventListener("change", save);
  testBtn.addEventListener("click", ()=>{ unlockAudio(); playAlarm(); vibrate(200); });
  alarmSel.addEventListener("change", ()=>{ alarmChoice=alarmSel.value; save(); unlockAudio(); playAlarm(); });
  document.addEventListener("pointerdown", unlockAudio, { once:true });
  document.addEventListener("touchend", unlockAudio, { once:true });

  document.querySelectorAll(".stepper button").forEach(b=>b.addEventListener("click",()=>{
    const t=$(b.dataset.target); const step=parseInt(b.dataset.step,10);
    t.value=(parseInt(t.value,10)||0)+step; t.dispatchEvent(new Event("change"));
  }));
  const presets=$("presets");
  presets.addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c)return;
    secsIn.value=c.dataset.secs; secsIn.dispatchEvent(new Event("change"));
    presets.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  });
  // mark active preset if matches
  presets.querySelectorAll(".chip").forEach(x=>{ if(+x.dataset.secs===duration) x.classList.add("on"); });

  // spacebar = start/pause (desktop)
  document.addEventListener("keydown",e=>{ if(e.code==="Space" && e.target.tagName!=="INPUT"){ e.preventDefault(); running?pause():start(); }
    else if(e.code==="ArrowRight"){ nextPlayer(); } });

  initAudio();
  Object.entries(SOUNDS).forEach(([k,v])=>{ const o=document.createElement("option"); o.value=k; o.textContent=v.label; alarmSel.append(o); });
  alarmSel.value=alarmChoice;
  buildNames();
  render();
})();
</script>
</body>
</html>
